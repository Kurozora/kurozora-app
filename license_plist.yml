options:
  xcodeprojPath: "*.xcodeproj"
  prefix: Acknowledgements
  sandbox-mode: true
manual:
  - name: KurozoraKit
    file: ../KurozoraKit/LICENSE
    source: https://github.com/kurozora/KurozoraKit
    licenseType: MIT
exclude:
  - APIKit
  - FLEX
  - HeliumLogger
  - LicensePlist
  - LoggerAPI
  - RxSwift
  - /^swift-.*$/
  - XcodeEdit
  - Yams
